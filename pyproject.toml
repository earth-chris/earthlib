[project]
authors = [{name = "Christopher Anderson", email = "cbanders@alumni.stanford.edu"}]
name = "earthlib"
version = "1.1.0"
description = "A global spectral library with earth engine tools for satellite land cover mapping."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "loguru>=0.7",
    "numpy>=1.21",
    "pandas>=1.3",
    "spectral>=0.22",
    "tqdm>=4.63",
]

[project.optional-dependencies]
ee = ["earthengine-api"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.sdist]
include = [
    "earthlib/",
    "pixi.lock",
    "pyproject.toml",
    "README.md",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
earthlib = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["py312", "test"], solve-group = "py312" }
py311 = { features = ["py311", "test"], solve-group = "py311" }
py312 = { features = ["py312", "test"], solve-group = "py312" }
py313 = { features = ["py313", "test"], solve-group = "py313" }
py314 = { features = ["py314", "test"], solve-group = "py314" }
lint = { features = ["lint"], solve-group = "lint", no-default-feature = true }
dev = { features = ["dev", "test", "lint", "py312"], solve-group = "py312" }
docs = { features = ["docs"], solve-group = "docs", no-default-feature = true }
build = { features = ["build"], solve-group = "build", no-default-feature = true }
typecheck = { features = ["typecheck", "py312"], solve-group = "typecheck" }

######## Pixi Python versions

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

######## Pixi Test

[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=7.4"
pytest-xdist = ">=3.3"
pytest-cov = ">=4.1"

[tool.pixi.feature.test.tasks]
test = "pytest -n auto --cov --no-cov-on-fail --cov-report=term-missing"

######## Pixi Docs

[tool.pixi.feature.docs.dependencies]
python = ">=3.11"

[tool.pixi.feature.docs.pypi-dependencies]
mkdocstrings = {extras = ["python"], version = "*"}
mkdocs = "*"
mkdocs-include-markdown-plugin = "*"
mkdocs-jupyter = "*"
mkdocs-material = "*"
livereload = "*"

[tool.pixi.feature.docs.tasks]
docs-deploy = "mkdocs gh-deploy --force"
docs-serve = "mkdocs serve"

######## Pixi Lint

[tool.pixi.feature.lint.dependencies]
python = ">=3.9"

[tool.pixi.feature.lint.pypi-dependencies]
ruff = ">=0.4"
pre-commit = ">=3.4"

[tool.pixi.feature.lint.tasks]
_setup = "pre-commit install"
lint = { cmd = "pre-commit run --all-files", depends-on = ["_setup"] }

######## Pixi Build

[tool.pixi.feature.build.dependencies]
python = ">=3.9"

[tool.pixi.feature.build.pypi-dependencies]
hatch = "*"
twine = "*"

[tool.pixi.feature.build.tasks]
build = "hatch build"
deploy = { cmd = "twine upload dist/*", depends-on = ["build"] }

######## Pixi Typecheck

[tool.pixi.feature.typecheck.pypi-dependencies]
mypy = ">=1.10"
pandas-stubs = "*"

[tool.pixi.feature.typecheck.tasks]
typecheck = "mypy earthlib"

######## Pixi Dev

[tool.pixi.feature.dev.dependencies]
cvxopt = ">=1.3.2"

[tool.pixi.feature.dev.pypi-dependencies]
ipython = ">=8.5"
jupyter = ">=1.0"
geemap = ">=0.26"
scipy = ">=1.0"
pysptools = ">=0.15.0"
scikit-learn = ">=1.0"
seaborn = ">=0.13.2"


### Tool Config ###

[tool.pytest.ini_options]
addopts = "--cov=earthlib --no-cov-on-fail --cov-report=term-missing"

[tool.coverage.run]
omit = ["earthlib/__init__.py", "earthlib/config.py", "earthlib/errors.py", "earthlib/geelib/*"]

[tool.mypy]
python_version = "3.12"
files = ["earthlib"]
disallow_untyped_defs = true
exclude = ["earthlib/geelib/"]

[[tool.mypy.overrides]]
module = ["spectral.*", "spectral.io.envi.*"]
ignore_missing_imports = true

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "venv",
    "notebooks",
]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
